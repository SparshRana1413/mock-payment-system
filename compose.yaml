
services:
  postgres:
    image: postgres:17
    container_name: payment-system-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_system
      POSTGRES_USER: payment_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_app -d payment_system"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
