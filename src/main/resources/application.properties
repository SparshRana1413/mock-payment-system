spring.config.import=optional:file:.env[.properties]

spring.application.name=payment-system

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

#JWT
jwt.secret=${JWT_SECRET}
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}
jwt.refresh-token.expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Bank Service gRPC Configuration
bank.grpc.host=${BANK_GRPC_HOST:localhost}
bank.grpc.port=${BANK_GRPC_PORT:50051}

# Bank Service gRPC Retry Configuration
bank.grpc.retry.max-attempts=${BANK_GRPC_RETRY_MAX_ATTEMPTS:3}
bank.grpc.retry.initial-backoff-ms=${BANK_GRPC_RETRY_INITIAL_BACKOFF_MS:100}
bank.grpc.retry.backoff-multiplier=${BANK_GRPC_RETRY_BACKOFF_MULTIPLIER:2.0}
bank.grpc.retry.max-backoff-ms=${BANK_GRPC_RETRY_MAX_BACKOFF_MS:2000}
bank.grpc.retry.timeout-ms=${BANK_GRPC_RETRY_TIMEOUT_MS:5000}




